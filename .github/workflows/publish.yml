name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build native library
        run: ./src/Hunspell.Native/build.sh x64

      - name: Pack SpellGE.Hunspell.Linux
        run: |
          dotnet pack src/Hunspell.Linux/Hunspell.Linux.csproj \
            --configuration Release \
            --output ./artifacts \
            /p:Version=${{ env.VERSION }} \
            /p:NativeOutputDir=${{ github.workspace }}/src/Hunspell.Native/out/x64

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg-linux
          path: ./artifacts/*.nupkg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build native library
        shell: pwsh
        run: ./src/Hunspell.Native/build.ps1

      - name: Pack SpellGE.Hunspell.Windows
        shell: pwsh
        run: |
          dotnet pack src/Hunspell.Windows/Hunspell.Windows.csproj `
            --configuration Release `
            --output ./artifacts `
            /p:Version=${{ env.VERSION }} `
            /p:NativeOutputDir=${{ github.workspace }}/src/Hunspell.Native/out/x64

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg-windows
          path: ./artifacts/*.nupkg

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - uses: actions/download-artifact@v8
        with:
          path: ./native-packages
          merge-multiple: true

      - name: Create local NuGet source
        run: |
          mkdir -p ${{ github.workspace }}/local-feed
          cp ./native-packages/*.nupkg ${{ github.workspace }}/local-feed/
          dotnet nuget add source ${{ github.workspace }}/local-feed --name local-feed

      - name: Pack SpellGE.Hunspell
        run: |
          dotnet pack src/Hunspell.Net/Hunspell.Net.csproj \
            --configuration Release \
            --output ./artifacts \
            /p:Version=${{ env.VERSION }}

      - name: Publish to NuGet.org
        run: |
          for pkg in ${{ github.workspace }}/local-feed/*.nupkg; do
            dotnet nuget push "$pkg" --api-key ${{ secrets.NUGET_ORG_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
          for pkg in ./artifacts/*.nupkg; do
            dotnet nuget push "$pkg" --api-key ${{ secrets.NUGET_ORG_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
