name: Benchmark

on:
  push:
    branches:
      - '**'

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  deployments: write

jobs:
  benchmark:
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            build-script: ./src/Hunspell.Native/build.sh x64
          - os: windows-latest
            build-script: pwsh ./src/Hunspell.Native/build.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build native library
        run: ${{ matrix.build-script }}

      - name: Run benchmarks
        run: dotnet run -c Release --project src/Hunspell.Net.Benchmarks -- --filter '*' --exporters json --job dry

      - name: Store benchmark results
        if: matrix.os == 'ubuntu-latest'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Hunspell.Net Benchmarks
          tool: benchmarkdotnet
          output-file-path: BenchmarkDotNet.Artifacts/results/Hunspell.Net.Benchmarks.HunspellBenchmarks-report-full.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          comment-on-alert: true
          alert-threshold: '150%'
          fail-on-alert: false
